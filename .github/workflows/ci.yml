name: Build and Validate

on:
    pull_request:
        branches: [ main ]
    push:
        branches: [ main ]

jobs:
    validate:
        runs-on: ubuntu-latest
        environment: Production

        permissions:
            contents: read

        env:
            DATABASE_URL: ${{ secrets.DATABASE_URL }}
            NEXT_PUBLIC_BASE_URL: ${{ secrets.NEXT_PUBLIC_BASE_URL }}
            NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

        steps:
            -   name: Checkout repository
                uses: actions/checkout@v4

            -   name: Setup Node.js
                uses: actions/setup-node@v4
                with:
                    node-version: "24"
                    cache: "npm"

            -   name: Install dependencies
                run: npm ci

            -   name: Validate required environment variables
                run: |
                    test -n "$DATABASE_URL" || (echo "Missing DATABASE_URL" && exit 1)
                    test -n "$NEXT_PUBLIC_BASE_URL" || (echo "Missing NEXT_PUBLIC_BASE_URL" && exit 1)
                    test -n "$NEXT_PUBLIC_SUPABASE_URL" || (echo "Missing NEXT_PUBLIC_SUPABASE_URL" && exit 1)
                    test -n "$NEXT_PUBLIC_SUPABASE_ANON_KEY" || (echo "Missing NEXT_PUBLIC_SUPABASE_ANON_KEY" && exit 1)

            -   name: Typecheck
                run: npm run typecheck

            -   name: Build Next.js
                run: npm run build